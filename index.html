<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گمٹی پیجن فلائنگ ٹورنامنٹ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            margin: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* Form Card Styling */
        .form-card {
            background: #ffffff;
            max-width: 450px;
            margin: 0 auto 30px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .form-card h3 {
            margin-top: 0;
            font-size: 18px;
        }

        .form-card input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        .form-card button {
            width: 95%;
            padding: 10px;
            background-color: #003366;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Table Container Styling */
        .table-container {
            overflow-x: auto;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px 5px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #003366;
            color: white;
            font-weight: bold;
        }

        /* Circle Styling for Time */
        .circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: 2px solid #336699;
            border-radius: 50%;
            font-weight: bold;
            color: #003366;
            background-color: #f0f7ff;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h2>🏆 گمٹی پیجن فلائنگ ٹورنامنٹ</h2>

    <!-- Entry Form -->
    <div class="form-card">
        <h3>📝 نئی اینٹری / وقت اپڈیٹ کریں</h3>
        <input type="text" id="playerName" placeholder="(مثلاً Ali) مالک کا نام">
        <input type="text" id="playerTimes" placeholder="(مثلاً 11.35,12.50,13.10) اوقات کوما سے الگ کریں">
        <button onclick="handleAddEntry()">جدول میں شامل کریں 💾</button>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table id="tournamentTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Pigeon 1</th>
                    <th>Pigeon 2</th>
                    <th>Pigeon 3</th>
                    <th>Pigeon 4</th>
                    <th>Pigeon 5</th>
                    <th>Pigeon 6</th>
                    <th>Pigeon 7</th>
                    <th>Pigeon 8</th>
                    <th>Pigeon 9</th>
                    <th>Pigeon 10</th>
                    <th>Pigeon 11</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows JS se dynamically add hongi -->
            </tbody>
        </table>
    </div>

    <script>
        // Data store karne ke liye object
    let players = {
  "ali": {
    displayName: "Ali",
    times: ["11.35", "12.35", "01.35", "02.35"]
  },
  "ahmed": {
    displayName: "Ahmed",
    times: ["04.35"]
  }
};


        function handleAddEntry() {
            let nameInput = document.getElementById("playerName").value.trim();
            let timesInput = document.getElementById("playerTimes").value.trim();

            if (!nameInput) {
                alert("براہ کرم مالک کا نام درج کریں!");
                return;
            }

            // Input times ko comma (,) se alag karke array banana
            let timesArray = timesInput ? timesInput.split(',').map(t => t.trim()).filter(t => t !== "") : [];

            let key = nameInput.toLowerCase();

            // Agar name pehle se nahi hai to naya entry banayein
            if (!players[key]) {
                players[key] = {
                    displayName: nameInput,
                    times: []
                };
            }

        timesArray.forEach((time, index) => {
    if (time !== "" && time !== "-") {
        players[key].times[index] = time;
    }
});

            // Inputs clear karna
            document.getElementById("playerName").value = "";
            document.getElementById("playerTimes").value = "";

            // Table update karna
            renderTable();
        }

        function renderTable() {
            let tbody = document.querySelector("#tournamentTable tbody");
            tbody.innerHTML = "";

            let index = 1;
            for (let key in players) {
                let player = players[key];
                let row = document.createElement("tr");

                let html = `<td>${index++}</td><td><b>${player.displayName}</b></td>`;

                // Exactly 11 columns ke liye loop
                for (let i = 0; i < 11; i++) {
                    if (player.times[i]) {
                        html += `<td><span class="circle">${player.times[i]}</span></td>`;
                    } else {
                        html += `<td>-</td>`;
                    }
                }

                row.innerHTML = html;
                tbody.appendChild(row);
            }
        }
    </script>

</body>
</html>
