<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گمٹی پیجن فلائنگ ٹورنامنٹ</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 650px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { color: #1a365d; }
    .input-group { margin-bottom: 15px; text-align: right; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .pigeon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
    .pigeon-grid input { text-align: center; }
    .btn-submit { background-color: #0d233a; color: white; padding: 10px 20px; border: none; border-radius: 6px; width: 100%; cursor: pointer; font-size: 16px; }
    .btn-admin { background-color: #f39c12; color: white; padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-logout { background-color: #7f8c8d; color: white; padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 650px; margin: 0 auto 15px auto; }
    
    .table-container { margin-top: 20px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th { background-color: #0d233a; color: white; padding: 10px; font-size: 14px; }
    td { border-bottom: 1px solid #ddd; padding: 10px; text-align: center; }
    
    .circle { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #0d233a; display: flex; align-items: center; justify-content: center; margin: auto; font-size: 13px; font-weight: bold; }
    .total-circle { border-color: #2e7d32; color: #2e7d32; }
    .btn-delete { background-color: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    
    .admin-only { display: none; }
  </style>
</head>
<body>

  <h2>🏆 گمٹی پیجن فلائنگ ٹورنامنٹ</h2>

  <div class="top-bar">
    <div id="statusBadge" style="font-weight: bold; color: #555;">حالت: صرف دیکھنے کی اجازت (Viewer)</div>
    <button id="adminToggleBtn" class="btn-admin" onclick="toggleAdmin()">🔒 ایڈمن لاگ ان</button>
  </div>

  <!-- ایڈمن اینٹری فارم (ڈیفالٹ پر چھپا ہوا ہے) -->
  <div id="adminForm" class="card admin-only">
    <h3>📝 نئی اینٹری / وقت اپ ڈیٹ کریں</h3>
    <div class="input-group">
      <label>:نام (Name)</label>
      <input type="text" id="participantName" placeholder="مثال: علی">
    </div>

    <div class="pigeon-grid">
      <div><label>Pigeon 1</label><input type="text" id="p1" placeholder="12.30"></div>
      <div><label>Pigeon 2</label><input type="text" id="p2" placeholder="12.40"></div>
      <div><label>Pigeon 3</label><input type="text" id="p3"></div>
      <div><label>Pigeon 4</label><input type="text" id="p4"></div>
      <div><label>Pigeon 5</label><input type="text" id="p5"></div>
      <div><label>Pigeon 6</label><input type="text" id="p6"></div>
      <div><label>Pigeon 7</label><input type="text" id="p7"></div>
      <div><label>Pigeon 8</label><input type="text" id="p8"></div>
      <div><label>Pigeon 9</label><input type="text" id="p9"></div>
    </div>

    <button class="btn-submit" onclick="saveData()">💾 جدول میں شامل کریں</button>
  </div>

  <div class="table-container">
    <table id="pigeonTable">
      <thead>
        <tr>
          <th>#</th>
          <th>نام</th>
          <th>Pigeon 1</th>
          <th>Pigeon 2</th>
          <th>Pigeon 3</th>
          <th>Pigeon 4</th>
          <th>Pigeon 5</th>
          <th>Pigeon 6</th>
          <th>Pigeon 7</th>
          <th>Pigeon 8</th>
          <th>Pigeon 9</th>
          <th>کل وقت</th>
          <th class="admin-only">عملیات</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>

  <script>
    const ADMIN_PASSWORD = "1234"; // 🔑 اپنا پاسورڈ یہاں تبدیل کریں
    let isAdmin = false;
    let playersData = JSON.parse(localStorage.getItem('pigeonData')) || {};

    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        updateAdminUI();
      } else {
        let pass = prompt("ایڈمن پاسورڈ درج کریں:");
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          updateAdminUI();
        } else if (pass !== null) {
          alert("غلط پاسورڈ!");
        }
      }
    }

    function updateAdminUI() {
      let adminElements = document.querySelectorAll('.admin-only');
      let btn = document.getElementById('adminToggleBtn');
      let badge = document.getElementById('statusBadge');

      if (isAdmin) {
        adminElements.forEach(el => el.style.display = 'block');
        // ٹیبل کالم درست دکھانے کے لیے
        document.querySelectorAll('th.admin-only, td.admin-only').forEach(el => el.style.display = 'table-cell');
        btn.innerText = "🔓 لاگ آؤٹ";
        btn.className = "btn-logout";
        badge.innerText = "حالت: ایڈمن موڈ (ایڈٹ کی اجازت ہے)";
        badge.style.color = "#2e7d32";
      } else {
        adminElements.forEach(el => el.style.display = 'none');
        btn.innerText = "🔒 ایڈمن لاگ ان";
        btn.className = "btn-admin";
        badge.innerText = "حالت: صرف دیکھنے کی اجازت (Viewer)";
        badge.style.color = "#555";
      }
      renderTable();
    }

    function calculateMinutes(timeStr) {
      if (!timeStr) return 0;
      let cleanTime = timeStr.replace('.', ':');
      let parts = cleanTime.split(':');
      let hours = parseInt(parts[0]) || 0;
      let minutes = parseInt(parts[1]) || 0;

      if (hours < 6) hours += 12;

      let totalFlyMinutes = ((hours - 6) * 60) + minutes;
      return totalFlyMinutes > 0 ? totalFlyMinutes : 0;
    }

    function formatTotalTime(totalMinutes) {
      if (totalMinutes <= 0) return "-";
      let hrs = Math.floor(totalMinutes / 60);
      let mins = totalMinutes % 60;
      return `${hrs}.${mins < 10 ? '0' : ''}${mins}`;
    }

    function saveData() {
      let name = document.getElementById('participantName').value.trim();
      if (!name) {
        alert('براہ کرم نام درج کریں!');
        return;
      }

      if (!playersData[name]) {
        playersData[name] = Array(9).fill('-');
      }

      for (let i = 1; i <= 9; i++) {
        let inputVal = document.getElementById(`p${i}`).value.trim();
        if (inputVal !== "") {
          playersData[name][i - 1] = inputVal;
        }
      }

      localStorage.setItem('pigeonData', JSON.stringify(playersData));
      renderTable();
      clearInputs();
    }

    function renderTable() {
      let tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      let index = 1;

      for (let name in playersData) {
        let row = document.createElement('tr');
        let pTimes = playersData[name];
        
        let rowTotalMinutes = 0;
        let pigeonCells = pTimes.map(time => {
          if (time !== '-') rowTotalMinutes += calculateMinutes(time);
          return `<td><div class="circle">${time}</div></td>`;
        }).join('');

        let totalFormatted = formatTotalTime(rowTotalMinutes);

        let actionTd = isAdmin ? `<td class="admin-only"><button class="btn-delete" onclick="deletePlayer('${name}')">حذف</button></td>` : '';

        row.innerHTML = `
          <td>${index++}</td>
          <td><b>${name}</b></td>
          ${pigeonCells}
          <td><div class="circle total-circle">${totalFormatted}</div></td>
          ${actionTd}
        `;

        tbody.appendChild(row);
      }
    }

    function deletePlayer(name) {
      if (confirm(`کیا آپ ${name} کی اینٹری ختم کرنا چاہتے ہیں؟`)) {
        delete playersData[name];
        localStorage.setItem('pigeonData', JSON.stringify(playersData));
        renderTable();
      }
    }

    function clearInputs() {
      document.getElementById('participantName').value = '';
      for (let i = 1; i <= 9; i++) {
        document.getElementById(`p${i}`).value = '';
      }
    }

    // ابتدائی لوڈ پر ٹیبل دکھائیں
    renderTable();
  </script>

</body>
</html>
