<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گمٹی پیجن فلائنگ ٹورنامنٹ</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; margin: 20px; }
    h2 { margin-bottom: 20px; }
    .form-card { background: #ffffff; max-width: 450px; margin: 0 auto 30px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .form-card input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; text-align: center; font-size: 14px; }
    .form-card button { width: 95%; padding: 12px; background-color: #002b5b; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #002b5b; color: white; }
    .time-badge { border: 1px solid #002b5b; border-radius: 50%; padding: 4px 8px; display: inline-block; color: #002b5b; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🏆 گمٹی پیجن فلائنگ ٹورنامنٹ</h2>

  <div class="form-card">
    <h3>📝 نئی اینٹری / وقت اپڈیٹ کریں</h3>
    <input type="text" id="ownerName" placeholder="مالک کا نام (مثلاً Ali)">
    <input type="text" id="pigeonTimes" placeholder="اوقات کوما سے الگ کریں (مثلاً 11.35,12.50,13.10)">
    <button onclick="saveData()">💾 جدول میں شامل کریں</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Pigeon 1</th>
        <th>Pigeon 2</th>
        <th>Pigeon 3</th>
        <th>Pigeon 4</th>
        <th>Pigeon 5</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- لائیو ڈیٹا یہاں خود بخود آئے گا -->
    </tbody>
  </table>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // آپ کی اپنی Firebase Config کیز
    const firebaseConfig = {
      apiKey: "AIzaSyBmHOJF-cRDr2DnM2giryDUlMbu",
      authDomain: "gumti-pigeon.firebaseapp.com",
      databaseURL: "https://gumti-pigeon-default-rtdb.firebaseio.com",
      projectId: "gumti-pigeon",
      storageBucket: "gumti-pigeon.appspot.com",
      messagingSenderId: "976301963421",
      appId: "1:976301963421:web:ebec5105e7d774b20c3c74",
      measurementId: "G-3M61X5Y8CR"
    };

    // Firebase Init
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 1. ڈیٹا سیو کرنے کا فنکشن
    function saveData() {
      const name = document.getElementById('ownerName').value.trim();
      const timesInput = document.getElementById('pigeonTimes').value.trim();

      if(!name || !timesInput) {
        alert('براہ کرم نام اور اوقات دونوں درج کریں۔');
        return;
      }

      const timesArray = timesInput.split(',').map(t => t.trim());

      database.ref('entries/' + name).set({
        name: name,
        times: timesArray
      }).then(() => {
        document.getElementById('ownerName').value = '';
        document.getElementById('pigeonTimes').value = '';
        alert('ڈیٹا لائیو اپڈیٹ ہو گیا ہے!');
      }).catch(error => {
        alert('مسئلہ آیا: ' + error.message);
      });
    }

    // 2. سب کے پاس لائیو ریئل ٹائم اپڈیٹ
    database.ref('entries').on('value', (snapshot) => {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      let index = 1;

      snapshot.forEach((childSnapshot) => {
        const item = childSnapshot.val();
        let row = `<tr>
          <td>${index++}</td>
          <td><b>${item.name}</b></td>`;

        for(let i = 0; i < 5; i++) {
          if(item.times && item.times[i]) {
            row += `<td><span class="time-badge">${item.times[i]}</span></td>`;
          } else {
            row += `<td>-</td>`;
          }
        }
        row += `</tr>`;
        tableBody.innerHTML += row;
      });
    });
  </script>
</body>
</html>
