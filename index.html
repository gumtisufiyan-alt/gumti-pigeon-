<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gumti Pigeon Flying Tournament</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#071b14;
    color:white;
}

header{
    text-align:center;
    padding:25px 10px;
    background:linear-gradient(135deg,#063b28,#0b6b47);
    border-bottom:3px solid #ffd700;
}

header h1{
    margin:0;
    color:#ffd700;
    font-size:28px;
}

header p{
    margin:8px 0 0;
    font-size:16px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:20px 10px;
}

.table-wrap{
    overflow-x:auto;
    background:#0b281e;
    border-radius:15px;
    box-shadow:0 0 25px #000;
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

th,td{
    padding:12px 7px;
    text-align:center;
    border:1px solid #315447;
}

th{
    background:#0e6041;
    color:#ffd700;
    font-size:15px;
}

.player-name{
    background:#123d2d;
    color:#fff;
    font-size:19px;
    font-weight:bold;
    min-width:130px;
}

.time-circle{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#123f2d;
    border:3px solid #ffd700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:15px;
    font-weight:bold;
    color:#fff;
}

.total-circle{
    background:#6d5200;
    border:3px solid #ffd700;
    color:#fff;
    font-size:14px;
}

.admin{
    margin-top:25px;
    background:#0d3023;
    padding:20px;
    border-radius:15px;
    border:1px solid #315447;
}

.admin h2{
    color:#ffd700;
    margin-top:0;
}

input{
    background:#071b14;
    color:white;
    border:1px solid #55796a;
    border-radius:7px;
    padding:9px;
    width:95px;
    text-align:center;
}

.name-input{
    width:130px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 16px;
    margin:5px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn,.save-btn{
    background:#ffd700;
    color:#071b14;
}

.logout-btn{
    background:#b52b2b;
    color:white;
}

.hidden{
    display:none;
}

#loginBox{
    max-width:350px;
    margin:25px auto;
    padding:20px;
    background:#0d3023;
    border-radius:15px;
    text-align:center;
}

#loginBox input{
    width:100%;
    margin:7px 0;
}

.status{
    text-align:center;
    margin:15px 0;
    color:#8ff0bf;
}

@media(max-width:600px){
    header h1{font-size:22px}
    .container{padding:10px 5px}
}
</style>
</head>

<body>

<header>
    <h1>🐦 Gumti Pigeon Flying Tournament 🏆</h1>
    <p>Live Pigeon Flying Tournament</p>
</header>

<div class="container">

<div class="status">
    🟢 Tournament Live
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
    <th>Player</th>
    <th>Pigeon 1</th>
    <th>Pigeon 2</th>
    <th>Pigeon 3</th>
    <th>Pigeon 4</th>
    <th>Pigeon 5</th>
    <th>Pigeon 6</th>
    <th>Pigeon 7</th>
    <th>Pigeon 8</th>
    <th>Pigeon 9</th>
    <th>Total Time</th>
</tr>
</thead>

<tbody id="playersTable"></tbody>
</table>
</div>

<!-- LOGIN -->
<div id="loginBox">
    <h2>🔐 Admin Login</h2>

    <input
        type="password"
        id="adminPassword"
        placeholder="Admin Password"
    >

    <button class="login-btn" onclick="login()">
        Login
    </button>

    <p id="loginMessage"></p>
</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin hidden">

<h2>⚙️ Admin Panel</h2>

<div id="adminRows"></div>

<button class="save-btn" onclick="saveData()">
    💾 Save Changes
</button>

<button class="logout-btn" onclick="logout()">
    Logout
</button>

</div>

</div>


<script>

/* =========================
   ADMIN PASSWORD
   =========================
   اپنی مرضی کا password یہاں لکھیں
*/
const ADMIN_PASSWORD = "12345";


/* =========================
   DEFAULT PLAYERS
   ========================= */

let players = [
    {
        name:"Mohsin",
        times:[
            "01:20",
            "02:10",
            "01:45",
            "02:00",
            "01:55",
            "02:15",
            "01:40",
            "02:20",
            "01:30"
        ]
    },

    {
        name:"Khuram",
        times:[
            "01:10",
            "02:05",
            "01:50",
            "02:10",
            "01:45",
            "02:00",
            "01:35",
            "02:15",
            "01:25"
        ]
    },

    {
        name:"Ranjha",
        times:[
            "01:30",
            "02:20",
            "01:55",
            "02:15",
            "02:00",
            "02:10",
            "01:50",
            "02:25",
            "01:40"
        ]
    }
];


/* =========================
   LOAD SAVED DATA
   ========================= */

const savedData = localStorage.getItem("gumtiTournament");

if(savedData){
    players = JSON.parse(savedData);
}


/* =========================
   TIME CALCULATION
   ========================= */

function timeToSeconds(time){

    if(!time || !time.includes(":")){
        return 0;
    }

    let parts = time.split(":");

    let minutes = parseInt(parts[0]) || 0;
    let seconds = parseInt(parts[1]) || 0;

    return (minutes * 60) + seconds;
}


function secondsToTime(seconds){

    let minutes = Math.floor(seconds / 60);

    let secs = seconds % 60;

    return String(minutes).padStart(2,"0")
        + ":" +
        String(secs).padStart(2,"0");
}


function calculateTotal(times){

    let total = 0;

    times.forEach(time=>{
        total += timeToSeconds(time);
    });

    return secondsToTime(total);
}


/* =========================
   SHOW PUBLIC TABLE
   ========================= */

function renderTable(){

    const table = document.getElementById("playersTable");

    table.innerHTML = "";

    players.forEach(player=>{

        let row = document.createElement("tr");

        let nameCell = document.createElement("td");

        nameCell.className = "player-name";

        nameCell.textContent = player.name;

        row.appendChild(nameCell);


        player.times.forEach(time=>{

            let cell = document.createElement("td");

            cell.innerHTML = `
                <div class="time-circle">
                    ${time}
                </div>
            `;

            row.appendChild(cell);

        });


        let totalCell = document.createElement("td");

        totalCell.innerHTML = `
            <div class="time-circle total-circle">
                ${calculateTotal(player.times)}
            </div>
        `;

        row.appendChild(totalCell);

        table.appendChild(row);

    });
}


/* =========================
   ADMIN PANEL
   ========================= */

function renderAdmin(){

    const adminRows = document.getElementById("adminRows");

    adminRows.innerHTML = "";

    players.forEach((player,index)=>{

        let box = document.createElement("div");

        box.style.marginBottom = "25px";
        box.style.padding = "15px";
        box.style.background = "#092219";
        box.style.borderRadius = "10px";

        let html = `
            <h3 style="color:#ffd700">
                Player ${index+1}
            </h3>

            <input
                class="name-input"
                id="name-${index}"
                value="${player.name}"
                placeholder="Player Name"
            >
            <br><br>
        `;

        player.times.forEach((time,pigeonIndex)=>{

            html += `
                <label>
                    Pigeon ${pigeonIndex+1}:
                </label>

                <input
                    id="time-${index}-${pigeonIndex}"
                    value="${time}"
                    placeholder="MM:SS"
                >
            `;

        });

        html += `
            <p style="color:#8ff0bf">
                Total:
                <strong id="admin-total-${index}">
                    ${calculateTotal(player.times)}
                </strong>
            </p>
        `;

        box.innerHTML = html;

        adminRows.appendChild(box);

    });

}


/* =========================
   LOGIN
   ========================= */

function login(){

    let password =
        document.getElementById("adminPassword").value;

    if(password === ADMIN_PASSWORD){

        document.getElementById("loginBox")
            .classList.add("hidden");

        document.getElementById("adminPanel")
            .classList.remove("hidden");

        renderAdmin();

    }else{

        document.getElementById("loginMessage")
            .textContent = "❌ Wrong Password";

    }
}


/* =========================
   SAVE DATA
   ========================= */

function saveData(){

    players.forEach((player,index)=>{

        player.name =
            document.getElementById(`name-${index}`).value;

        player.times =
            player.times.map((time,pigeonIndex)=>{

                return document.getElementById(
                    `time-${index}-${pigeonIndex}`
                ).value;

            });

    });


    localStorage.setItem(
        "gumtiTournament",
        JSON.stringify(players)
    );


    renderTable();

    renderAdmin();

    alert("✅ Changes Saved Successfully!");

}


/* =========================
   LOGOUT
   ========================= */

function logout(){

    document.getElementById("adminPanel")
        .classList.add("hidden");

    document.getElementById("loginBox")
        .classList.remove("hidden");

    document.getElementById("adminPassword").value = "";

}


/* =========================
   START
   ========================= */

renderTable();

</script>

</body>
</html>
