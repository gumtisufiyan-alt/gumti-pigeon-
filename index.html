<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گمٹی پیجن فلائنگ ٹورنامنٹ</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; margin: 20px; }
    h2 { margin-bottom: 20px; }
    .form-card { background: #ffffff; max-width: 450px; margin: 0 auto 20px auto; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-card input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
    .form-card button { width: 95%; padding: 12px; background-color: #002b5b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; display: block; overflow-x: auto; white-space: nowrap; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #002b5b; color: white; }
    .time-badge { border: 1px solid #002b5b; border-radius: 5px; padding: 2px 6px; color: #002b5b; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🏆 گمٹی پیجن فلائنگ ٹورنامنٹ</h2>

  <div class="form-card">
    <h3>📝 نئی اینٹری / وقت اپڈیٹ کریں</h3>
    <input type="text" id="ownerName" placeholder="(مثلاً Ali) مالک کا نام">
    <input type="text" id="pigeonTimes" placeholder="اوقات کوما سے الگ کریں (مثلاً 11.35,12.50,01.30)">
    <button onclick="saveData()">💾 جدول میں شامل کریں</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Pigeon 1</th>
        <th>Pigeon 2</th>
        <th>Pigeon 3</th>
        <th>Pigeon 4</th>
        <th>Pigeon 5</th>
        <th>Pigeon 6</th>
        <th>Pigeon 7</th>
        <th>Pigeon 8</th>
        <th>Pigeon 9</th>
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>

  <script>
    let tournamentData = JSON.parse(localStorage.getItem('pigeonData')) || [];

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      tournamentData.forEach((entry, index) => {
        let row = `<tr>
          <td>${index + 1}</td>
          <td><b>${entry.name}</b></td>`;
        
        for (let i = 0; i < 9; i++) {
          let time = entry.times[i] ? `<span class="time-badge">${entry.times[i]}</span>` : '-';
          row += `<td>${time}</td>`;
        }
        
        row += `</tr>`;
        tbody.innerHTML += row;
      });
    }

    function saveData() {
      const name = document.getElementById('ownerName').value.trim();
      const timesInput = document.getElementById('pigeonTimes').value.trim();

      if (!name) {
        alert('براہ کرم مالک کا نام درج کریں!');
        return;
      }

      const times = timesInput ? timesInput.split(',').map(t => t.trim()) : [];

      let existingEntry = tournamentData.find(e => e.name.toLowerCase() === name.toLowerCase());
      if (existingEntry) {
        existingEntry.times = times;
      } else {
        tournamentData.push({ name: name, times: times });
      }

      localStorage.setItem('pigeonData', JSON.stringify(tournamentData));
      document.getElementById('ownerName').value = '';
      document.getElementById('pigeonTimes').value = '';
      renderTable();
    }

    renderTable();
  </script>

</body>
</html>
