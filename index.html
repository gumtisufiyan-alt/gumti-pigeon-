<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گمٹی پیجن فلائنگ ٹورنامنٹ</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; direction: rtl; }
    h2 { text-align: center; }
    .card { background: white; padding: 15px; border-radius: 8px; max-width: 400px; margin: 0 auto 20px auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #0b2f5c; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background-color: #0b2f5c; color: white; }
    .action-btn { background: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Aap ke Firebase Credentials
    const firebaseConfig = {
      apiKey: "AiZaSyBmHOJF-cRDr2DnM2giryDUlMbu...",
      authDomain: "gumti-pigeon.firebaseapp.com",
      databaseURL: "https://gumti-pigeon-default...",
      projectId: "gumti-pigeon",
      storageBucket: "gumti-pigeon.firebasestor...",
      messagingSenderId: "976301963421",
      appId: "1:976301963421:web:ebec5105e7d774...",
      measurementId: "G-3M61X5Y8CR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const playersRef = collection(db, "players");

    // Live Fetching (No Refresh Needed)
    onSnapshot(playersRef, (snapshot) => {
      const tableBody = document.getElementById("tableBody");
      tableBody.innerHTML = "";
      let index = 1;

      snapshot.forEach((docSnapshot) => {
        const data = docSnapshot.data();
        const id = docSnapshot.id;

        const row = `
          <tr>
            <td>${index++}</td>
            <td><strong>${data.name}</strong></td>
            <td>${data.p1 || '-'}</td>
            <td>${data.p2 || '-'}</td>
            <td>${data.p3 || '-'}</td>
            <td>
              <button class="action-btn" onclick="deletePlayer('${id}')">Delete</button>
            </td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    });

    // Add Player Function
    window.savePlayer = async function() {
      const name = document.getElementById("pName").value;
      const p1 = document.getElementById("p1Time").value;
      const p2 = document.getElementById("p2Time").value;
      const p3 = document.getElementById("p3Time").value;

      if (!name) {
        alert("Meherbani karke Naam likhein!");
        return;
      }

      await addDoc(playersRef, { name, p1, p2, p3 });
      
      document.getElementById("pName").value = "";
      document.getElementById("p1Time").value = "";
      document.getElementById("p2Time").value = "";
      document.getElementById("p3Time").value = "";
    };

    // Delete Player Function
    window.deletePlayer = async function(id) {
      if(confirm("Kya aap is entry ko delete karna chahte hain?")) {
        await deleteDoc(doc(db, "players", id));
      }
    };
  </script>
</head>
<body>

  <h2>🏆 گمٹی پیجن فلائنگ ٹورنامنٹ</h2>

  <!-- Admin Panel -->
  <div class="card">
    <h3>📝 نئی اینٹری / نام اپڈیٹ کریں</h3>
    <div class="input-group">
      <label>نام (Name):</label>
      <input type="text" id="pName" placeholder="Naam likhein">
    </div>
    <div class="input-group">
      <label>Pigeon 1 Time:</label>
      <input type="text" id="p1Time" placeholder="12.50">
    </div>
    <div class="input-group">
      <label>Pigeon 2 Time:</label>
      <input type="text" id="p2Time" placeholder="01.15">
    </div>
    <div class="input-group">
      <label>Pigeon 3 Time:</label>
      <input type="text" id="p3Time" placeholder="02.25">
    </div>
    <button onclick="savePlayer()">جدول میں شامل کریں</button>
  </div>

  <!-- Live Table -->
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Pigeon 1</th>
        <th>Pigeon 2</th>
        <th>Pigeon 3</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>

</body>
</html>
