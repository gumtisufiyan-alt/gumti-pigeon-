<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گمٹی پیجن فلائنگ ٹورنامنٹ</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; direction: rtl; }
    h2 { text-align: center; color: #0b2f5c; }
    .card { background: white; padding: 15px; border-radius: 8px; max-width: 500px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin: 0 auto 20px auto; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .input-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .inputs-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .inputs-grid input { width: 30%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
    button { background: #0b2f5c; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    button:hover { background-color: #071f3d; }
    .table-container { overflow-x: auto; max-width: 100%; }
    table { width: 100%; border-collapse: collapse; background: white; min-width: 800px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background-color: #0b2f5c; color: white; font-size: 14px; }
    
    .time-badge { display: inline-block; width: 42px; height: 42px; line-height: 42px; border-radius: 50%; background-color: #e6f0fa; color: #0b2f5c; border: 2px solid #0b2f5c; font-weight: bold; text-align: center; margin: 2px; font-size: 12px; direction: ltr; }
    .total-badge { background-color: #e8f5e9; border-color: #2e7d32; color: #2e7d32; font-weight: bold; width: auto; padding: 0 10px; border-radius: 20px; }
    .action-btn { background: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AiZaSyBmHOJF-cRDr2DnM2giryDUlMbu...",
      authDomain: "gumti-pigeon.firebaseapp.com",
      databaseURL: "https://gumti-pigeon-default-rtdb.firebaseio.com",
      projectId: "gumti-pigeon",
      storageBucket: "gumti-pigeon.firebasestorage.app",
      messagingSenderId: "976301963421",
      appId: "1:976301963421:web:ebec5105e7d774...",
      measurementId: "G-3M61X5Y8CR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const playersRef = collection(db, "players");

    // Live Table Loading (9 Pigeons + Total)
    onSnapshot(playersRef, (snapshot) => {
      const tableBody = document.getElementById("tableBody");
      tableBody.innerHTML = "";
      let index = 1;

      snapshot.forEach((docSnapshot) => {
        const data = docSnapshot.data();
        const id = docSnapshot.id;

        const row = `
          <tr>
            <td>${index++}</td>
            <td><strong>${data.name}</strong></td>
            <td><span class="time-badge">${data.p1 || '-'}</span></td>
            <td><span class="time-badge">${data.p2 || '-'}</span></td>
            <td><span class="time-badge">${data.p3 || '-'}</span></td>
            <td><span class="time-badge">${data.p4 || '-'}</span></td>
            <td><span class="time-badge">${data.p5 || '-'}</span></td>
            <td><span class="time-badge">${data.p6 || '-'}</span></td>
            <td><span class="time-badge">${data.p7 || '-'}</span></td>
            <td><span class="time-badge">${data.p8 || '-'}</span></td>
            <td><span class="time-badge">${data.p9 || '-'}</span></td>
            <td><span class="time-badge total-badge">${data.total || '-'}</span></td>
            <td><button class="action-btn" onclick="deletePlayer('${id}')">حذف</button></td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    });

    window.savePlayer = async function() {
      const name = document.getElementById("pName").value;
      if (!name) { alert("نام لکھنا ضروری ہے!"); return; }

      await addDoc(playersRef, {
        name: name,
        p1: document.getElementById("p1").value,
        p2: document.getElementById("p2").value,
        p3: document.getElementById("p3").value,
        p4: document.getElementById("p4").value,
        p5: document.getElementById("p5").value,
        p6: document.getElementById("p6").value,
        p7: document.getElementById("p7").value,
        p8: document.getElementById("p8").value,
        p9: document.getElementById("p9").value,
        total: document.getElementById("pTotal").value
      });

      // Clear Form
      for(let i=1; i<=9; i++) document.getElementById(`p${i}`).value = "";
      document.getElementById("pName").value = "";
      document.getElementById("pTotal").value = "";
    };

    window.deletePlayer = async function(id) {
      if(confirm("کیا آپ اس اینٹری کو ختم کرنا چاہتے ہیں؟")) {
        await deleteDoc(doc(db, "players", id));
      }
    };
  </script>
</head>
<body>

  <h2>🏆 گمٹی پیجن فلائنگ ٹورنامنٹ</h2>

  <div class="card">
    <h3>📝 نئی اینٹری / وقت اپڈیٹ کریں</h3>
    <div class="input-group">
      <label>نام (Name):</label>
      <input type="text" id="pName" placeholder="نام لکھیں">
    </div>
    <div class="inputs-grid">
      <input type="text" id="p1" placeholder="Pigeon 1">
      <input type="text" id="p2" placeholder="Pigeon 2">
      <input type="text" id="p3" placeholder="Pigeon 3">
      <input type="text" id="p4" placeholder="Pigeon 4">
      <input type="text" id="p5" placeholder="Pigeon 5">
      <input type="text" id="p6" placeholder="Pigeon 6">
      <input type="text" id="p7" placeholder="Pigeon 7">
      <input type="text" id="p8" placeholder="Pigeon 8">
      <input type="text" id="p9" placeholder="Pigeon 9">
    </div>
    <div class="input-group">
      <label>کل وقت (Total Time):</label>
      <input type="text" id="pTotal" placeholder="مثال: 45.30">
    </div>
    <button onclick="savePlayer()">جدول میں شامل کریں 💾</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>نام</th>
          <th>Pigeon 1</th>
          <th>Pigeon 2</th>
          <th>Pigeon 3</th>
          <th>Pigeon 4</th>
          <th>Pigeon 5</th>
          <th>Pigeon 6</th>
          <th>Pigeon 7</th>
          <th>Pigeon 8</th>
          <th>Pigeon 9</th>
          <th>کل وقت</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</body>
</html>
